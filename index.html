<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess My Number</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-panel">

    <div class="top-bar">
      <button class="again-btn" id="againBtn">Again!</button>
      <div class="range-hint">(Between 1 and 100)</div>
    </div>

    <h1 class="game-title">Guess My Number!</h1>

    <div class="line-container">
        <div class="center-line"></div>
            <div class="secret-display">
                <div class="secret-number" id="secretDisplay">?</div>
            </div>
    </div>

    <div class="main-row">
      <div class="input-area">
        <input type="number" id="guessInput" class="guess-input" placeholder="?" min="1" max="100" value="">
        <button class="check-btn" id="checkBtn">Check!</button>
      </div>

      <div class="stats-area">
        <div class="feedback-line" id="feedbackLine">
          <span class="icon">💡</span>
          <span id="feedbackText">Start guessing...</span>
        </div>
        <div class="score-line">
          <span class="icon">🏆</span>
          <span>Score: <span id="scoreValue">20</span></span>
        </div>
        <div class="score-line">
          <span class="icon">🥇</span>
          <span>Highscore: <span id="highscoreValue">20</span></span>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
